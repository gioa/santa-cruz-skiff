<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#163e47">
  <meta name="description" content="潮汐之间的海岸旅程：Half Moon Bay。走过沙滩，在浪边抛竿，再去 Bait & Tackle 小店补给。">
  <title>Half Moon Bay · 潮汐之间</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23163e47' d='M0 0h32v32H0z'/%3E%3Cpath fill='%23f8d393' d='M14 3h4v3h4v16h-4v6h-4v-6h-4V6h4z'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./pixel.css">
  <link rel="stylesheet" href="./pacifica.css">
  <link rel="stylesheet" href="./pixel-locations.css">
</head>
<body>
<main id="app" class="is-intro" data-location="half-moon-bay" data-shore-scene>
<canvas id="world" aria-label="Half Moon Bay 沙滩钓场，Francis、Venice 与 Dunes 的浅色沙滩，轻点沙地行走，轻点海面瞄准" tabindex="0"></canvas>
<header class="hud"><div class="brand"><span>≈</span><div>潮汐之间<small>HALF MOON BAY · PIXEL FISHING</small></div></div><div class="day-card"><span id="weather-icon" aria-label="天气">☁</span><time id="clock">06:00</time><span id="weather">晨雾</span></div><div class="hud-tools"><button id="credits-btn" class="coin-button" aria-label="查看鱼获与潮汐点"><i>✦</i><span id="credits">100</span></button><button id="audio-btn" class="square" aria-label="开关声音">♪</button><button id="settings-btn" class="square" aria-label="设置与帮助">☰</button></div></header>
<section id="intro" class="intro"><div class="stamp"><span></span>A LITTLE ROD. A WHOLE OCEAN.</div><h1>潮汐之间<small>像素里的海风，<br>属于你的慢时光。</small></h1><p>一片沙滩，一根鱼竿。<br>从 Half Moon Bay 的清晨出发。</p><button id="start-btn" class="primary intro-start">去沙滩 <span>→</span></button><button id="resume-btn" class="text-button" hidden>继续上次航程 ↗</button><div class="intro-foot"><span id="intro-clock">06:00 AM</span><i></i><span>HALF MOON BAY, CA</span></div></section>
<div id="intro-location" class="intro-location"><span>37°28′ N · 122°27′ W</span><strong>THE BEACH</strong><small>今天，也去浪边待一会儿。</small></div>
<nav id="trip-tools" class="trip-tools" hidden aria-label="航程工具"><button id="gear-btn" aria-label="背包与装备"><canvas data-icon="backpack" width="16" height="16"></canvas><span>背包</span><kbd>I</kbd></button><button id="map-btn" aria-label="沿岸手记" hidden><canvas data-icon="map" width="16" height="16"></canvas><span>手记</span><kbd>M</kbd></button><button id="journal-btn" aria-label="鱼获与航程"><canvas data-icon="fish" width="16" height="16"></canvas><span>鱼获</span><kbd>J</kbd></button></nav>
<button id="rules-btn" class="rules-book-btn" type="button" hidden aria-label="打开加州休闲捕鱼规定" title="加州休闲捕鱼规定"><canvas data-item-art="ca_fishing_regulations" width="32" height="32" aria-hidden="true"></canvas><span>规定</span></button>
<section id="trip-info" class="trip-info" hidden><span id="place">Half Moon Bay</span><div><span id="speed">沙滩</span><span id="shore-rig-summary"></span></div><small id="navigation"></small></section>
<div id="toast" role="status" aria-live="polite"></div>
<div id="controls" class="controls" hidden>
<section id="boat-console" class="actions-only" aria-label="岸钓操作台">
 <section id="boat-fishing" class="no-instruments" hidden aria-label="鱼竿与鱼轮控制台">
  <section id="fish-status" class="fish-status" hidden aria-live="polite"><div class="fish-status-head"><i></i><b id="fish-title">等待鱼讯</b></div><small id="fish-detail"></small></section>
  <div class="rod-identity"><span id="active-rod-name">岸钓竿</span><span id="tackle-name">Carolina · 沙蟹</span><button id="rod-config-btn" type="button" aria-label="配置当前鱼竿" title="配置当前鱼竿"><svg viewBox="0 0 24 24" width="23" height="23" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="15" cy="4" r="2"/><path d="M15 6v10a5 5 0 0 1-10 0v-4l4 3" stroke-linejoin="round"/></svg></button></div>
  <div class="fishing-toolbar">
   <div id="shore-drag-control" class="shore-adjustments" hidden><label for="shore-drag"><span>泄力 <output id="shore-drag-value">适中</output></span><input id="shore-drag" type="range" min="10" max="100" step="5" value="50" aria-label="泄力松紧"></label></div>
   <div class="reel-actions"><button id="beach-cast">按住抛竿</button><button id="beach-reel" hidden><svg id="shore-reel-mechanism" viewBox="0 0 46 36" width="46" height="36" aria-hidden="true"><path d="M22 23v9h10" class="reel-frame"/><circle cx="22" cy="14" r="10" class="reel-body"/><g id="shore-bail"><path d="M11 17Q7 -1 26 3" class="reel-bail"/><circle cx="26" cy="3" r="2" class="reel-line-guide"/></g><g id="shore-spool"><circle cx="22" cy="14" r="6" class="reel-spool"/><path d="M22 8v4M22 16v4M16 14h4M24 14h4" class="reel-spool-mark"/></g><g id="shore-crank"><path d="M22 14L37 23" class="reel-handle"/><rect x="34" y="20" width="8" height="6" rx="2" class="reel-grip"/></g></svg><span id="beach-reel-label">抬竿 / 收线</span></button></div>
   <div id="cast-charge" class="cast-gesture" hidden><span id="charge-label">拉竿 · 松手抛出</span></div>
  </div>
 </section>
</section>
</div>
<div id="modal-layer" hidden><section id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button id="close-modal" class="square close" aria-label="关闭窗口">×</button><div id="modal-content"></div></section></div>
<output id="beach-state" hidden></output>
</main>
<script type="module" src="./pacifica-game.js"></script>
<script type="module" src="./pixel-locations.js"></script>
</body></html>
