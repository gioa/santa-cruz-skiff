<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163e47"><meta name="description" content="潮汐之间：Santa Cruz 卡通像素海钓。整理装备，驾驶小木船，听着海风等一尾鱼。支持手机与电脑。"><title>潮汐之间 · 像素海钓</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23163e47' d='M0 0h32v32H0z'/%3E%3Cpath fill='%23f8d393' d='M14 3h4v3h4v16h-4v6h-4v-6h-4V6h4z'/%3E%3C/svg%3E"><link rel="stylesheet" href="./pixel.css?v=20260927-pixel-css-v29"></head>
<body><main id="app" class="is-intro"><canvas id="world" aria-label="Santa Cruz 俯视像素海钓世界"></canvas><canvas id="fight-view" hidden role="slider" tabindex="0" aria-label="第一视角鱼竿，上下拖动抬竿，左右拖动摆竿" aria-valuemin="5" aria-valuemax="85" aria-valuenow="45"></canvas><div id="loading"><span>≈</span><p>海风正在抵达…</p></div>
<header class="hud"><div class="brand"><span>≈</span><div>潮汐之间<small>SANTA CRUZ · PIXEL FISHING</small></div></div><div class="day-card"><span>☀</span><time id="clock">06:00</time><span id="weather">晨风</span></div><div class="hud-tools"><button id="credits-btn" class="coin-button" aria-label="查看鱼获与潮汐点"><i>✦</i><span id="credits">100</span></button><button id="audio-btn" class="square" aria-label="开关声音">♪</button><button id="settings-btn" class="square" aria-label="设置与帮助">☰</button></div></header>
<section id="intro" class="intro"><div class="stamp"><span></span>A LITTLE BOAT. A WHOLE OCEAN.</div><h1>潮汐之间<small>像素里的海风，<br>属于你的慢时光。</small></h1><p>一艘小木船，一根鱼竿。<br>从 Santa Cruz 的清晨出发。</p><button id="start-btn" class="primary intro-start">去码头 <span>→</span></button><button id="resume-btn" class="text-button" hidden>继续上次航程 ↗</button><div class="intro-foot"><span>06:00 AM</span><i></i><span>MONTEREY BAY, CA</span></div></section>
<div id="intro-location" class="intro-location"><span>36°57′ N · 122°01′ W</span><strong>THE WHARF</strong><small>今天，也去海上待一会儿。</small></div>
<nav id="trip-tools" class="trip-tools" hidden aria-label="航程工具"><button id="gear-btn" aria-label="背包与装备"><canvas data-icon="backpack" width="16" height="16"></canvas><span>背包</span><kbd>I</kbd></button><button id="map-btn" aria-label="海图与航向"><b>⌖</b><span>海图</span><kbd>M</kbd></button><button id="journal-btn" aria-label="鱼获与航程"><canvas data-icon="fish" width="16" height="16"></canvas><span>鱼获</span><kbd>J</kbd></button></nav>
<section id="trip-info" class="trip-info" hidden><span id="place">Santa Cruz Wharf</span><div><span id="speed">码头</span><span id="depth" hidden></span><span id="heading" hidden></span></div><small id="navigation" hidden></small></section>

<div id="world-actions" hidden aria-label="场景交互"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="controls" class="controls" hidden>
 <button id="guide-btn" class="small-button">码头小屋</button>
 <section id="boat-console" hidden aria-label="小木船操控台">
  <div id="boat-action-bar"><button id="interact-btn" class="small-button" hidden><span id="interact-label">靠泊上岸</span></button><button id="engine-btn" class="small-button" hidden>启动引擎</button><button id="fishing-tab" class="small-button" hidden>鱼竿</button><button id="rods-btn" class="small-button" aria-label="切换鱼竿与更换消耗品" hidden>换竿装配</button></div>
  <div id="rod-monitor" hidden><canvas width="160" height="40" aria-hidden="true"></canvas><span>手持</span><b></b></div>
  <div id="helm" hidden>
   <div id="tiller-touch" class="tiller-touch" role="slider" tabindex="0" aria-label="舷外机握把，左右摆动" aria-valuemin="-35" aria-valuemax="35" aria-valuenow="0"><span class="helm-label">握把</span><div class="tiller-travel" aria-hidden="true"></div><div class="tiller-arm" aria-hidden="true"><i class="tiller-shaft"></i><i class="tiller-handgrip"></i></div><div class="outboard-head" aria-hidden="true"><span>8</span></div></div>
   <div class="throttle-panel"><div id="throttle-touch" class="in-neutral" role="slider" tabindex="0" aria-label="前后挡与油门推杆，向上前进向下倒车，中间空挡" aria-valuemin="-100" aria-valuemax="100" aria-valuenow="0" aria-valuetext="空挡"><span class="helm-label"><span>推杆</span><span class="throttle-readout"><b id="throttle-gear">N</b><b id="throttle-value">0%</b></span></span><div class="throttle-gate" aria-hidden="true"><i class="throttle-detent"></i></div><div class="throttle-markings" aria-hidden="true"><span class="throttle-forward"><b>F</b><small>前进</small></span><span class="throttle-neutral"><b>N</b><small>空挡</small></span><span class="throttle-reverse"><b>R</b><small>倒车</small></span></div><div class="throttle-lever" aria-hidden="true"><i class="throttle-stem"></i><i class="throttle-knob"><span></span></i></div></div></div>
  </div>
  <section id="boat-fishing" hidden aria-label="鱼竿与鱼轮控制台">
   <section id="fish-status" class="fish-status" hidden aria-live="polite"><div class="fish-status-head"><i></i><b id="fish-title">等待鱼讯</b><span id="fish-distance"></span></div><small id="fish-detail"></small></section>
   <div class="tackle-caption"><span id="tackle-name">手持 · 沉底组</span><span id="rod-load"></span></div>
   <div class="fishing-instruments">
    <canvas id="rod-pose" width="240" height="150" role="slider" tabindex="0" aria-label="鱼竿姿态，上下抬竿左右摆竿" aria-valuemin="5" aria-valuemax="85" aria-valuenow="45"></canvas>
    <div id="reel-instrument" class="reel-instrument"><canvas id="reel-wheel" width="160" height="112" role="slider" tabindex="0" aria-label="鱼轮，顺时针摇动收线" aria-valuemin="0" aria-valuemax="120" aria-valuenow="0"></canvas><button id="reel-btn" aria-label="按住鱼轮手柄收线">收线</button><button id="spool-toggle" aria-pressed="false">打开线杯</button></div>
   </div>
   <div class="fishing-toolbar"><button id="lower-rig">船边下放</button><button id="retrieve-rig" hidden>电动收线</button><button id="take-rod" hidden>拿起鱼竿</button><select id="rod-mount" aria-label="放入船侧竿架"><option value="hand" hidden disabled>放入竿架</option><option value="port">左舷</option><option value="starboard">右舷</option></select><button id="drag-knob" role="slider" aria-label="鱼轮泄力，向上拖动增加" aria-valuemin="20" aria-valuemax="85" aria-valuenow="48" aria-valuetext="泄力适中">✳ 泄力</button></div>
  </section>
 </section>
</div>
<div id="modal-layer" hidden><section id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button id="close-modal" class="square close" aria-label="关闭窗口">×</button><div id="modal-content"></div></section></div><output id="game-state" hidden></output>
</main><script type="module" src="./pixel-game.js?v=20260927-pixel-v29"></script></body></html>
