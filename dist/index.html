<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#163e47"><meta name="description" content="潮汐之间：Santa Cruz 卡通像素海钓。整理装备，驾驶小木船，听着海风等一尾鱼。支持手机与电脑。"><title>潮汐之间 · 像素海钓</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath fill='%23163e47' d='M0 0h32v32H0z'/%3E%3Cpath fill='%23f8d393' d='M14 3h4v3h4v16h-4v6h-4v-6h-4V6h4z'/%3E%3C/svg%3E"><link rel="stylesheet" href="./pixel.css?v=20260927-pixel-css-v4"></head>
<body><main id="app" class="is-intro"><canvas id="world" aria-label="Santa Cruz 俯视像素海钓世界"></canvas><div id="loading"><span>≈</span><p>海风正在抵达…</p></div>
<header class="hud"><div class="brand"><span>≈</span><div>潮汐之间<small>SANTA CRUZ · PIXEL FISHING</small></div></div><div class="day-card"><span>☀</span><time id="clock">06:00</time><span id="weather">晨风</span></div><div class="hud-tools"><button id="credits-btn" class="coin-button" aria-label="查看鱼获与潮汐点"><i>✦</i><span id="credits">100</span></button><button id="audio-btn" class="square" aria-label="开关声音">♪</button><button id="settings-btn" class="square" aria-label="设置与帮助">☰</button></div></header>
<section id="intro" class="intro"><div class="stamp"><span></span>A LITTLE BOAT. A WHOLE OCEAN.</div><h1>潮汐之间<small>像素里的海风，<br>属于你的慢时光。</small></h1><p>一艘小木船，一根鱼竿。<br>从 Santa Cruz 的清晨出发。</p><button id="start-btn" class="primary intro-start">去码头 <span>→</span></button><button id="resume-btn" class="text-button" hidden>继续上次航程 ↗</button><div class="intro-foot"><span>06:00 AM</span><i></i><span>MONTEREY BAY, CA</span></div></section>
<div id="intro-location" class="intro-location"><span>36°57′ N · 122°01′ W</span><strong>THE WHARF</strong><small>今天，也去海上待一会儿。</small></div>
<nav id="trip-tools" class="trip-tools" hidden aria-label="航程工具"><button id="gear-btn" aria-label="背包与装备"><canvas data-icon="backpack" width="16" height="16"></canvas><span>背包</span><kbd>I</kbd></button><button id="map-btn" aria-label="海图与航向"><b>⌖</b><span>海图</span><kbd>M</kbd></button><button id="journal-btn" aria-label="鱼获与航程"><canvas data-icon="fish" width="16" height="16"></canvas><span>鱼获</span><kbd>J</kbd></button></nav>
<section id="trip-info" class="trip-info" hidden><span id="place">Santa Cruz Wharf</span><div><span id="speed">码头</span><span id="depth" hidden></span><span id="heading" hidden></span><span id="fuel">油量 100%</span></div><small id="navigation" hidden></small></section>
<section id="fish-status" class="fish-status" hidden aria-live="polite"><div class="fish-status-head"><i></i><b id="fish-title">等待鱼讯</b><span id="fish-distance"></span></div><div id="tension-row" aria-live="off" hidden><div class="meter-caption"><span>鱼线张力</span><b id="tension-value">0%</b></div><div class="meter tension"><i id="tension-fill"></i><span></span></div><div class="meter-caption"><span>鱼的体力</span><b id="stamina-value">100%</b></div><div class="meter stamina"><i id="stamina-fill"></i></div></div><div id="cast-row" aria-live="off" hidden><div class="meter power"><i id="power-fill"></i></div><small>松开抛出</small></div><small id="fish-detail"></small></section>
<div id="toast" role="status" aria-live="polite"></div>
<div id="controls" class="controls" hidden><div class="left-controls"><button id="guide-btn" class="small-button">去租船小屋 ↗</button><div id="joystick" role="group" aria-label="移动摇杆，上下控制前进后退，左右转向"><span class="north">▲</span><span class="west">◀</span><span class="east">▶</span><span class="south">▼</span><i id="stick-thumb"></i></div><span id="stick-label">行走 <kbd>W A S D</kbd></span></div><div class="right-controls"><div class="boat-controls"><button id="engine-btn" class="small-button" hidden>启动引擎</button><button id="anchor-btn" class="small-button" hidden>下锚</button><button id="more-btn" class="small-button" hidden aria-label="更多船上动作">···</button></div><div id="drag-control" hidden><button id="drag-minus" aria-label="降低泄力">−</button><span id="drag-label">泄力 48%</span><button id="drag-plus" aria-label="提高泄力">+</button></div><div class="main-actions"><button id="reel-btn" class="action-button reel" hidden><span>收线</span><small>按住</small></button><button id="cast-btn" class="action-button" hidden><canvas data-icon="rod" width="16" height="16"></canvas><span id="cast-label">抛竿</span><small id="cast-hint">按住 · 松开抛</small></button><button id="interact-btn" class="action-button" hidden><span id="interact-label">整理装备</span><small>E</small></button></div></div></div>
<div id="modal-layer" hidden><section id="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><button id="close-modal" class="square close" aria-label="关闭窗口">×</button><div id="modal-content"></div></section></div><output id="game-state" hidden></output>
</main><script type="module" src="./pixel-game.js?v=20260927-pixel-v3"></script></body></html>
