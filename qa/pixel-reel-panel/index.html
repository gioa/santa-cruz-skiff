<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>精简鱼轮控制台 · 本机验收</title><link rel="stylesheet" href="../../dist/pixel.css"><style>#qa{position:fixed;top:10px;left:10px;z-index:99;background:#fff1d5;padding:8px;color:#173f43;font:12px system-ui}#qa select{font:inherit;padding:8px}#result{display:block;font:11px monospace}</style><main id="app"><canvas id="world"></canvas><canvas id="fight-view" hidden></canvas><div id="controls" class="controls"><section id="boat-console" class="fishing-open">  <section id="boat-fishing" aria-label="鱼竿与鱼轮控制台">
   <section id="fish-status" class="fish-status" hidden aria-live="polite"><div class="fish-status-head"><i></i><b id="fish-title">等待鱼讯</b><span id="fish-distance"></span></div><small id="fish-detail"></small></section>
   <div class="tackle-caption"><span id="tackle-name">手持 · 沉底组</span><span id="rod-load"></span></div>
   <div class="fishing-instruments">
    <div id="reel-instrument" class="reel-instrument"><canvas id="reel-wheel" width="160" height="112" role="slider" tabindex="0" aria-label="鱼轮，顺时针摇动收线" aria-valuemin="0" aria-valuemax="120" aria-valuenow="0"></canvas><button id="reel-btn" aria-label="按住鱼轮手柄收线">收线</button><button id="spool-toggle" aria-pressed="false">打开线杯</button></div>
   </div>
   <div class="fishing-toolbar"><button id="lower-rig">船边下放</button><button id="retrieve-rig" hidden>电动收线</button><button id="take-rod" hidden>拿起鱼竿</button><select id="rod-mount" aria-label="放入船侧竿架"><option value="hand" hidden disabled>放入竿架</option><option value="port">左舷</option><option value="starboard">右舷</option></select><button id="drag-knob" role="slider" aria-label="鱼轮泄力，向上拖动增加" aria-valuemin="20" aria-valuemax="85" aria-valuenow="48" aria-valuetext="泄力适中">✳ 泄力</button></div>
  </section></section></div></main><div id="qa">本机验收 <select id="phase" aria-label="钓鱼状态"><option value="idle">尚未下竿</option><option value="waiting">已抛投 · 等鱼</option><option value="fight">中鱼 · 第一视角</option><option value="landed">已上鱼</option></select><output id="result"></output></div>
<script type="module">
import {PixelSimulation,FISHING_SPOTS} from '../../dist/pixel-sim.js';
import {createFightView} from '../../dist/pixel-fight-view.js';
import {createPixelWorld} from '../../dist/pixel-world.js';
import {createPixelSprites} from '../../dist/pixel-sprites.js';
import {mountFishingConsole} from '../../dist/pixel-fishing-ui.js';
import {boatActions} from '../../dist/pixel-boat-actions.js';
if(!['localhost','127.0.0.1'].includes(location.hostname))throw Error('Local QA only');
const $=id=>document.getElementById(id),sim=new PixelSimulation({rng:()=>.5});sim.start();Object.assign(sim.state,{mode:'boat',rentalPaid:true,launchStage:'afloat',boatX:FISHING_SPOTS[1].x,boatZ:FISHING_SPOTS[1].z,fishState:'idle',fish:{latin:'Ophiodon elongatus',length:53,kg:1.34},paidLineMeters:18,lureDepth:15,rodBend:.4,rodLoadN:9,rodMount:'hand',rodTip:{x:2,z:0,height:1.8},lineEntry:{x:2.3,z:-1},reelMode:'brake'});
const sprites=createPixelSprites(),world=createPixelWorld($('world'),{sprites}),view=createFightView($('fight-view'),{sprites});
const ui=mountFishingConsole($('boat-fishing'),{sim,getActions:()=>boatActions(sim.state,{canLower:true}),onFeedback:()=>{},onMount:m=>sim.setRodMount(m),onRetrieve:()=>{}});let last=performance.now();
function resize(){view.resize(innerWidth,innerHeight);world.resize(innerWidth,innerHeight);}onresize=resize;resize();
$('phase').onchange=e=>{sim.state.fishState=e.target.value;};
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;const focus=sim.state.fishState==='fight';$('app').classList.toggle('is-fishing-focus',focus);$('fight-view').hidden=!focus;world.draw(sim.state,dt);view.draw(sim.state,dt,{active:focus,bottomInset:innerHeight<500?120:180});ui.update();ui.draw(dt);$('result').textContent=`${innerWidth}×${innerHeight} · ${sim.state.fishState} · 重复鱼竿控件 ${document.querySelectorAll('#rod-pose').length}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
