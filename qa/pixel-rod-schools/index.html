<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>竿尖与饵群 · 本机验证</title>
<style>*{box-sizing:border-box;user-select:none}body{overflow:hidden;margin:0;background:#173f43;color:#fff0cf;font:14px system-ui}canvas{display:block;width:100%;height:calc(100dvh - 154px);image-rendering:pixelated}header{padding:8px 12px;height:154px;background:#173f43}select,button{font:inherit;padding:7px;margin:3px;background:#fff0cf;color:#173f43;border:0}output{display:block;font:11px monospace;white-space:pre-wrap;overflow-wrap:anywhere}p{margin:3px}</style>
<canvas id="view"></canvas><header><p>本机测试场景 · 实际游戏渲染与物理模块</p><select id="scene" aria-label="场景"><option value="rod">中鱼竿尖</option><option value="schools">随机饵鱼群</option></select><select id="fish" aria-label="鱼"><option value="rockfish:.3">小 rockfish · 0.7 lb</option><option value="rockfish:5">大 rockfish · 11 lb</option><option value="salmon:6">Salmon · 13 lb</option><option value="bonito:3">Bonito · 6.6 lb</option><option value="seabass:12">WSB · 26 lb</option></select><select id="rod" aria-label="鱼竿"><option value="rod">通用中快调竿</option><option value="rod_light">轻型快调竿</option><option value="rod_boat">强力中调竿</option></select><button id="pause">暂停</button><button id="regen">更换鱼群</button><output id="status"></output></header>
<script type="module">
import {PixelSimulation,FISHING_SPOTS,HARBOR} from '../../dist/pixel-sim.js';
import {createFightView} from '../../dist/pixel-fight-view.js';
import {createPixelWorld} from '../../dist/pixel-world.js';
import {createPixelSprites} from '../../dist/pixel-sprites.js';
import {createFishFight} from '../../dist/pixel-fish-fight.js';
import {createBaitSchool} from '../../dist/pixel-bait-schools.js';
import {rodTipPosition} from '../../dist/pixel-fishing-physics.js';
import {syncVessel} from '../../dist/vessel-physics.js';
const $=id=>document.getElementById(id);if(!['localhost','127.0.0.1'].includes(location.hostname))throw Error('Local QA only');
const canvas=$('view'),sprites=createPixelSprites(),view=createFightView(canvas,{sprites}),world=createPixelWorld(canvas,{sprites,conditions:{waveHeight:.4,waterTemp:16,windKnots:3}});let sim,paused=false,last=performance.now(),stats=[],seed=94;
const random=()=>{seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296;};
function reset(){sim=new PixelSimulation({rng:()=>.5,conditions:{waveHeight:.4,windKnots:3,currentX:0,currentZ:0}});sim.start();const s=sim.state,p=FISHING_SPOTS[1],kind=$('fish').value.split(':')[0],kg=Number($('fish').value.split(':')[1]);Object.assign(s,{mode:'boat',launchStage:'afloat',rentalPaid:true,moored:false,boatX:p.x,boatZ:p.z,fishState:'fight',fish:{fightKind:kind,latin:kind==='rockfish'?'Sebastes melanops':kind,kg,length:kind==='rockfish'?(kg<1?24:65):80},lureDepth:15,paidLineMeters:17.2,reelMode:'brake',rodBend:.3,rodLoadN:3,rodAzimuth:70,rodElevation:45});s.profile.loadout.rod=$('rod').value;s.profile.owned.push($('rod').value);s.packed.push($('rod').value);s.fishFight=createFishFight(s.fish);s.rodTip=rodTipPosition(s);s.bobber={x:s.rodTip.x,z:s.rodTip.z,height:-15};syncVessel(sim.vessel,{x:p.x,z:p.z,heading:0,clearMotion:true});stats=[];resize();}
function resize(){if($('scene').value==='rod')view.resize(innerWidth,innerHeight-154);else{world.resize(innerWidth,innerHeight-154);world.setBottomInset(0);world.setTopInset(0);}}
function schools(){world.wildlife.events.splice(0);for(let i=0;i<2;i++){const d=createBaitSchool(random,{depth:30,month:9,waterTemp:16}),s=sim.state;world.wildlife.events.push({...d,id:i+1,type:'bait',name:'测试饵群',x:s.boatX+(i?-20:16),z:s.boatZ+(i?26:-24),age:10,duration:3600,members:Math.max(1,Math.round(d.density*d.radius*.5)),speed:.1,heading:0,phase:0});}}
$('fish').onchange=reset;$('rod').onchange=reset;$('scene').onchange=()=>{reset();schools();};$('regen').onclick=schools;$('pause').onclick=()=>{paused=!paused;sim.pause(paused);$('pause').textContent=paused?'继续':'暂停';};onresize=resize;reset();schools();
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;const s=sim.state;s.paused=paused;if($('scene').value==='rod'){sim.step(dt);view.draw(s,dt,{active:true,paused,bottomInset:0});if(!paused)stats.push(s.rodTipMotion?.y||0);if(stats.length>600)stats.shift();const g=view.snapshot();$('status').textContent=JSON.stringify({phase:s.fishState,tip:g.rodTip,bend:+s.rodBend.toFixed(3),motion:+(s.rodTipMotion?.y||0).toFixed(3),range:stats.length?+(Math.max(...stats)-Math.min(...stats)).toFixed(3):0});}else{s.fishState='idle';world.draw(s,dt);sim.setBaitSchools(world.wildlife.events);$('status').textContent=world.wildlife.events.filter(e=>e.type==='bait').map(e=>`半径 ${e.radius.toFixed(1)}m · 密度 ${e.density.toFixed(2)} · 跟随 ${e.followers.map(f=>f.kind).join(',')||'无'}`).join('\n');}requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
