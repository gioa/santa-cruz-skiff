<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../../dist/pixel.css?v=20260927-pixel-css-v27"><style>body{height:auto;overflow:auto;background:#497f87;padding:16px}.sample{background:#fff1d4;border:2px solid #21474e;padding:20px;margin-bottom:14px}.sample h2{margin:0 0 8px}.sample p{margin:0;font-size:12px;color:#62776f}.sample canvas{display:block;width:100%;height:70px;image-rendering:pixelated;margin-top:12px}.qa-label{color:#fff2d4;font-size:11px;margin-bottom:12px}</style><body><p class="qa-label">鱼名排版预览 · QA 样例，非实际鱼获</p><main></main><script type="module">

 const card=document.createElement('section');card.className='sample';card.innerHTML=`<h2>${f.name}</h2><p><strong class="fish-common-name">${fishCommonName(f)}</strong><br>${f.latin}</p><canvas width="300" height="70"></canvas>`;document.querySelector('main').append(card);const c=card.querySelector('canvas').getContext('2d');c.imageSmoothingEnabled=false;c.drawImage(sprites.fish[f.art],102,11,96,48);
