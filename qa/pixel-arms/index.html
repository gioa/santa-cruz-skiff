<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>手臂与握持 · 手机验证</title><link rel="stylesheet" href="../../dist/pixel.css"><style>#qa{position:fixed;z-index:100;top:8px;left:8px;right:8px;display:flex;gap:4px;flex-wrap:wrap;font:11px system-ui;color:#173f43}#qa button,#qa label{padding:5px;background:#fff1d5;border:1px solid #173f43}#qa input[type=range]{width:65px;vertical-align:middle}#result{position:fixed;top:72px;left:12px;font:10px monospace;color:#173f43;z-index:90;max-width:95%;pointer-events:none}</style><main id="app" class="is-fishing-focus"><canvas id="fight-view"></canvas><div id="controls" class="controls"><section id="boat-console" class="fishing-open">  <section id="boat-fishing" aria-label="鱼竿与鱼轮控制台">
   <section id="fish-status" class="fish-status" hidden aria-live="polite"><div class="fish-status-head"><i></i><b id="fish-title">等待鱼讯</b><span id="fish-distance"></span></div><small id="fish-detail"></small></section>
   <div class="tackle-caption"><span id="tackle-name">手持 · 沉底组</span><span id="rod-load"></span></div>
   <div class="fishing-instruments">
    <canvas id="rod-pose" width="240" height="150" role="slider" tabindex="0" aria-label="鱼竿姿态，上下抬竿左右摆竿" aria-valuemin="5" aria-valuemax="85" aria-valuenow="45"></canvas>
    <div id="reel-instrument" class="reel-instrument"><canvas id="reel-wheel" width="160" height="112" role="slider" tabindex="0" aria-label="鱼轮，顺时针摇动收线" aria-valuemin="0" aria-valuemax="120" aria-valuenow="0"></canvas><button id="reel-btn" aria-label="按住鱼轮手柄收线">收线</button><button id="spool-toggle" aria-pressed="false">打开线杯</button></div>
   </div>
   <div class="fishing-toolbar"><button id="lower-rig">船边下放</button><button id="retrieve-rig" hidden>电动收线</button><button id="take-rod" hidden>拿起鱼竿</button><select id="rod-mount" aria-label="放入船侧竿架"><option value="hand" hidden disabled>放入竿架</option><option value="port">左舷</option><option value="starboard">右舷</option></select><button id="drag-knob" role="slider" aria-label="鱼轮泄力，向上拖动增加" aria-valuemin="20" aria-valuemax="85" aria-valuenow="48" aria-valuetext="泄力适中">✳ 泄力</button></div>
  </section></section></div></main><div id="qa"><button id="toggle">查看小鱼竿面板</button><label>抬竿<input id="elevation" aria-label="抬竿" type="range" min="5" max="85" value="45"></label><label>摆竿<input id="azimuth" aria-label="摆竿" type="range" min="-110" max="110" value="70"></label><button id="crank">摇轮</button><button id="holder">插入竿架</button></div><output id="result"></output>
<script type="module">
import {PixelSimulation} from '../../dist/pixel-sim.js';
import {createFightView} from '../../dist/pixel-fight-view.js';
import {mountFishingConsole} from '../../dist/pixel-fishing-ui.js';
if(!['localhost','127.0.0.1'].includes(location.hostname))throw Error('Local QA only');
const $=id=>document.getElementById(id),sim=new PixelSimulation({rng:()=>.5});sim.start();Object.assign(sim.state,{mode:'boat',fishState:'fight',fish:{latin:'Ophiodon elongatus',length:53,kg:1.34},paidLineMeters:18,lureDepth:15,rodBend:.5,rodLoadN:12,rodMount:'hand',rodTip:{x:2,z:0,height:1.8},lineEntry:{x:2.3,z:-1},reelMode:'brake'});let focus=true,rotating=false,last=performance.now();
const view=createFightView($('fight-view')),ui=mountFishingConsole($('boat-fishing'),{sim,getActions:()=>({pose:!focus,adjustPose:true,reelInstrument:true,reel:true,spool:true,drag:true}),onFeedback:()=>{},onMount:m=>sim.setRodMount(m),onRetrieve:()=>{}});
function resize(){view.resize(innerWidth,innerHeight);}onresize=resize;resize();
$('toggle').onclick=()=>{focus=!focus;$('app').classList.toggle('is-fishing-focus',focus);$('fight-view').hidden=!focus;$('toggle').textContent=focus?'查看小鱼竿面板':'查看第一视角';ui.update();};
$('elevation').oninput=e=>{sim.state.rodElevation=Number(e.target.value);};$('azimuth').oninput=e=>{sim.state.rodAzimuth=Number(e.target.value);};
$('crank').onclick=()=>{rotating=!rotating;$('crank').textContent=rotating?'停轮':'摇轮';};$('holder').onclick=()=>{sim.state.rodMount=sim.state.rodMount==='hand'?'port':'hand';$('holder').textContent=sim.state.rodMount==='hand'?'插入竿架':'拿起鱼竿';};
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;sim.state.crankRate=rotating?.6:0;view.draw(sim.state,dt,{active:focus,bottomInset:innerHeight<500?120:180});ui.update();ui.draw(dt);const snap=view.snapshot();$('result').textContent=`本机验收 · 实际渲染组件 · ${innerWidth}×${innerHeight} · ${sim.state.rodMount} · ${sim.state.rodElevation}° · crank ${snap.crankAngle?.toFixed(2)}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
