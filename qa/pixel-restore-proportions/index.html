<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>15 英尺船体与抛投比例 · 本机验收</title><link rel="stylesheet" href="../../dist/pixel.css"><style>#qa{position:fixed;top:8px;left:8px;right:8px;z-index:99;background:#fff1d5;padding:8px;color:#173f43;font:12px system-ui}#qa button{padding:8px;margin:5px 2px 5px 0}#result{display:block;font:11px monospace}#rulers{position:fixed;left:12px;top:132px;pointer-events:none;color:#fff6d7;font:11px monospace;z-index:90}.ruler{height:21px;border-bottom:2px solid;border-left:2px solid;border-right:2px solid;margin-bottom:12px;white-space:nowrap}</style><main id="app"><canvas id="world"></canvas><canvas id="fight-view" hidden></canvas><div id="controls" class="controls"><section id="boat-console" class="fishing-open">  <section id="boat-fishing" aria-label="鱼竿与鱼轮控制台">
   <section id="fish-status" class="fish-status" hidden aria-live="polite"><div class="fish-status-head"><i></i><b id="fish-title">等待鱼讯</b><span id="fish-distance"></span></div><small id="fish-detail"></small></section>
   <div class="tackle-caption"><span id="tackle-name">手持 · 沉底组</span><span id="rod-load"></span></div>
   <div class="fishing-instruments">
    <div id="reel-instrument" class="reel-instrument"><canvas id="reel-wheel" width="160" height="112" role="slider" tabindex="0" aria-label="鱼轮，顺时针摇动收线" aria-valuemin="0" aria-valuemax="120" aria-valuenow="0"></canvas><button id="reel-btn" aria-label="按住鱼轮手柄收线">收线</button><button id="spool-toggle" aria-pressed="false">打开线杯</button></div>
   </div>
   <div class="fishing-toolbar"><button id="lower-rig">船边下放</button><button id="retrieve-rig" hidden>电动收线</button><button id="take-rod" hidden>拿起鱼竿</button><select id="rod-mount" aria-label="放入船侧竿架"><option value="hand" hidden disabled>放入竿架</option><option value="port">左舷</option><option value="starboard">右舷</option></select><button id="drag-knob" role="slider" aria-label="鱼轮泄力，向上拖动增加" aria-valuemin="20" aria-valuemax="85" aria-valuenow="48" aria-valuetext="泄力适中">✳ 泄力</button></div>
  </section></section></div></main><div id="qa">本机验收 · 15 ft 船长，保留码头与船比例 · 单独校准出线<br><button data-feet="15">抛 15 ft</button><button data-feet="30">抛 30 ft</button><button data-feet="60">抛 60 ft</button><button id="reset">重置</button><output id="result"></output></div><div id="rulers"><div id="hull-ruler" class="ruler">船长 15 ft</div><div id="cast-ruler" class="ruler"></div></div>
<script type="module">
import {PixelSimulation,FISHING_SPOTS} from '../../dist/pixel-sim.js';
import {syncVessel} from '../../dist/vessel-physics.js';
import {createPixelWorld} from '../../dist/pixel-world.js';
import {createPixelSprites} from '../../dist/pixel-sprites.js';
import {mountFishingConsole} from '../../dist/pixel-fishing-ui.js';
import {boatActions} from '../../dist/pixel-boat-actions.js';
if(!['localhost','127.0.0.1'].includes(location.hostname))throw Error('Local QA only');
const $=id=>document.getElementById(id),sim=new PixelSimulation({rng:()=>.5,patrolRng:()=>1,conditions:{currentMps:0,windKnots:0}});sim.start();
const home=FISHING_SPOTS[1];Object.assign(sim.state,{mode:'boat',rentalPaid:true,launchStage:'afloat',loaded:true,moored:false,boatX:home.x,boatZ:home.z,heading:0});syncVessel(sim.vessel,{x:home.x,z:home.z,heading:0,clearMotion:true});const initial=structuredClone(sim.state);
const world=createPixelWorld($('world'),{sprites:createPixelSprites()}),ui=mountFishingConsole($('boat-fishing'),{sim,getActions:()=>boatActions(sim.state,{canLower:sim.fishingReadiness().ok}),onFeedback:r=>{},onMount:m=>sim.setRodMount(m),onRetrieve:()=>{}});let target=null,last=performance.now();
function reset(){Object.assign(sim.state,structuredClone(initial));syncVessel(sim.vessel,{x:home.x,z:home.z,heading:0,clearMotion:true});world.setZoom(null);target=null;}
function cast(p){reset();const result=sim.castTo(p);if(result.ok)target=p;}
$('reset').onclick=reset;for(const b of document.querySelectorAll('[data-feet]'))b.onclick=()=>cast({x:home.x+Number(b.dataset.feet)*.3048,z:home.z});
$('world').addEventListener('pointerup',e=>{const p=world.screenToFishingWorld(e.clientX,e.clientY,sim.state);cast(p);});
function resize(){world.resize(innerWidth,innerHeight);world.setTopInset(200);world.setBottomInset(190);}onresize=resize;resize();
function frame(now){const dt=Math.min(.1,(now-last)/1000);last=now;const was=sim.state.fishState;sim.step(dt);if(was==='flight'&&sim.state.fishState==='sinking'){world.setZoom(world.camera.scale);sim.pause(true);}world.draw(sim.state,sim.state.paused?0:dt);ui.update();ui.draw(dt);const s=sim.state,hull=world.publicState().boats.player,dist=target?Math.hypot(target.x-s.boatX,target.z-s.boatZ):0;
$('hull-ruler').style.width=hull.hullLength+'px';$('cast-ruler').style.width=(dist/4.572*hull.hullLength)+'px';$('cast-ruler').hidden=!target;$('cast-ruler').textContent=`落点 ${(dist/.3048).toFixed(1)} ft · ${(dist/4.572).toFixed(1)} 船长`;
$('result').textContent=`${innerWidth}×${innerHeight} · ${s.fishState} · 出线 ${(s.paidLineMeters/.3048).toFixed(1)} ft · ${sim.state.paused?'落水帧暂停':'可点击水面抛投'}`;requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script></html>
