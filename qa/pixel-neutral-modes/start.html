<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>空挡与左侧模式测试</title>
<style>body{font:18px system-ui;padding:30px;background:#fff1d5;color:#173f43;line-height:1.8}button{font:inherit;padding:18px;background:#173f43;color:#fff;border:0}</style><h1>空挡与左侧模式 · 测试场景</h1><p>仅本机 4190 端口：基础鱼竿、已租船，位于 Lighthouse 参考钓点。与正式存档隔离。</p><button id="start">进入基础竿抛投测试</button><button id="float">进入浮漂钓组测试</button>
<script type="module">
import {PixelSimulation,HARBOR,FISHING_SPOTS} from '../../dist/pixel-sim.js';
for(const button of document.querySelectorAll('button')){button.disabled=location.hostname!=='localhost'||location.port!=='4190';button.onclick=()=>{const sim=new PixelSimulation();sim.start();Object.assign(sim.state,{playerX:HARBOR.counterX,playerZ:HARBOR.counterZ});sim.launchBoat();for(let i=0;i<250;i++)sim.step(.1);Object.assign(sim.state,{playerX:HARBOR.boardingX,playerZ:HARBOR.boardingZ});sim.board();if(button.id==='float'){sim.state.profile.credits=200;sim.state.mode='walk';sim.state.playerX=HARBOR.counterX;sim.state.playerZ=HARBOR.counterZ;sim.buyGear('rig_float');sim.replaceRig(undefined,'float');sim.replaceBait(undefined,'squid');sim.state.mode='boat';}const p=FISHING_SPOTS[1];Object.assign(sim.state,{boatX:p.x,boatZ:p.z,heading:0});localStorage.setItem('santa-cruz-pixel-v1',JSON.stringify(sim.snapshot()));location.href='/dist/?edition=pixel';};}
</script>
