<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#f4e7c7;font:15px system-ui;color:#244c4f}h3{margin:16px}canvas{width:100%;max-width:780px;image-rendering:pixelated;display:block}button{padding:12px;margin:12px;font-size:16px}</style><h3>海豚轮廓：原版 / 修改后</h3><canvas id="preview" width="780" height="800"></canvas><button id="animate">播放游动</button><script type="module">
import {drawWildlife as before} from './qa-dolphin-before.js';import {drawWildlife as after} from './pixel-wildlife.js';
const c=document.querySelector('canvas'),x=c.getContext('2d');let time=0,playing=false,last=performance.now();document.querySelector('button').onclick=()=>{playing=!playing;document.querySelector('button').textContent=playing?'暂停':'播放游动';};
function draw(){x.fillStyle='#36969c';x.fillRect(0,0,780,800);const event={type:'dolphins',species:'pacific-white-sided-dolphin',x:0,z:0,heading:-1.3,age:12+time,phase:.12,duration:100,members:5};for(const [render,y,label] of [[before,155,'原版'],[after,390,'修改后']]){x.fillStyle='#fff1d5';x.font='18px sans-serif';x.fillText(label,20,y-80);render(x,[event],{project:(a,b)=>({x:390+a*12,y:y+b*12}),scale:12});}x.fillStyle='#fff1d5';x.fillText('游戏尺度',20,555);after(x,[{...event,heading:0}],{project:(a,b)=>({x:390+a*5.5,y:595+b*5.5}),scale:5.5});x.fillStyle='#fff1d5';x.fillText('轮廓放大',20,710);after(x,[{...event,members:1,heading:-1.1,age:10,phase:0}],{project:(a,b)=>({x:390+a*40,y:730+b*40}),scale:40});}
function frame(t){if(playing)time+=(t-last)/1000;last=t;draw();requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
