<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鱼长比例验证</title>
<link rel="stylesheet" href="../../dist/pixel.css">
<style>body{height:auto;overflow:auto;padding:18px 14px;background:#2c797f}main{max-width:540px;margin:auto}h1{font-size:22px;margin:0 0 16px;letter-spacing:1px;color:#fff1d5}article{background:#fff1d5;border:2px solid #173e46;padding:10px 12px;margin-bottom:12px}h2{font-size:14px;margin:0;display:flex;justify-content:space-between}h2 small{font:700 14px monospace}.catch-hero{margin:8px 0 0;min-height:0}.notes{color:#fff1d5;font-size:11px;margin-top:6px}#surface{width:100%;height:400px;display:block}select{padding:8px;min-height:44px;background:#fff1d5}#journal{display:flex;gap:12px;overflow-x:auto}#journal canvas{flex:0 0 96px}</style>
<main><h1>鱼长 · 同一把尺</h1><section id="cards"></section><p class="notes">渲染验证：8 in、16 in、32 in 的长度为 1 : 2 : 4。</p><article><h2>鱼获记录缩略图</h2><div id="journal"></div></article><article><h2>水面视角</h2><select id="surface-size" aria-label="水面鱼长"><option value="20.32">8 in</option><option value="40.64">16 in</option><option value="81.28">32 in</option></select><canvas id="surface"></canvas></article></main>
<script type="module">
import {createPixelSprites} from '../../dist/pixel-sprites.js';
import {drawFishArt,fishSpriteKind} from '../../dist/pixel-fish-art.js';
import {createFightView} from '../../dist/pixel-fight-view.js';
const sprites=createPixelSprites(),fish=[{name:'白石首鱼',latin:'Genyonemus lineatus',length:20.32,inches:8},{name:'长蛇齿单线鱼',latin:'Ophiodon elongatus',length:40.64,inches:16},{name:'帝王鲑',latin:'Oncorhynchus tshawytscha',length:81.28,inches:32}];
for(const [i,f]of fish.entries()){const a=document.createElement('article');a.innerHTML=`<h2>${f.name}<small>${f.inches} in</small></h2><div class="catch-hero"><canvas id="fish-${i}" role="img" aria-label="${f.inches}英寸鱼的等比例展示"></canvas></div>`;document.querySelector('#cards').append(a);const j=document.createElement('canvas');j.id=`journal-${i}`;document.querySelector('#journal').append(j);}
const view=createFightView(document.querySelector('#surface'),{sprites});
function render(){for(const[i,f]of fish.entries()){const c=document.querySelector(`#fish-${i}`),layout=drawFishArt(c,sprites.fish[fishSpriteKind(f)],f,{width:Math.floor(c.parentElement.clientWidth),height:140});c.style.width=`${layout.width}px`;c.style.height=`${layout.height}px`;c.dataset.layout=JSON.stringify(layout);const j=document.querySelector(`#journal-${i}`);drawFishArt(j,sprites.fish[fishSpriteKind(f)],f,{width:96,height:48,compact:true});j.style.width='96px';j.style.height='48px';}renderSurface();}
function renderSurface(){const c=document.querySelector('#surface');view.resize(c.clientWidth,400);view.draw({fishState:'fight',fish:{...fish[1],length:Number(document.querySelector('#surface-size').value)},boatX:0,boatZ:0,bobber:{x:1.4,z:-1.4,height:-.3},lureDepth:.3,paidLineMeters:4,rodMount:'hand',rodElevation:45,rodAzimuth:70,rodBend:.35,rig:'bottom',rodTip:{x:1.4,z:-1.4,height:1.8},lineEntry:{x:1.4,z:-1.4},fishMotion:{headShake:.4},heading:0},0,{active:true,reducedMotion:true,bottomInset:0});c.dataset.geometry=JSON.stringify(view.snapshot());}
document.querySelector('#surface-size').onchange=renderSurface;window.addEventListener('resize',render);render();
</script></html>
