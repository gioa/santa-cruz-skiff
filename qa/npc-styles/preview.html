<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>NPC wardrobe QA</title>
<style>body{margin:0;padding:20px;background:#eee1bd;color:#163e47;font:14px system-ui}h1{font-size:24px;margin:0 0 8px}p{margin:0 0 20px;max-width:780px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}article{border:2px solid #637c68;padding:14px;background:#fff4d6}h2{font-size:16px;margin:0 0 6px}canvas{image-rendering:pixelated;width:240px;height:138px;max-width:100%}small{display:block;color:#526858;line-height:1.5}#scene{width:min(900px,100%);height:auto;border:2px solid #637c68}button{padding:12px;margin:8px 8px 8px 0}</style>
<h1>One coast, different people</h1><p>Actual game renderers. Front, back and walking/fishing poses at 2× scale; identity and clothes persist across poses.</p><div class="grid" id="gallery"></div>
<h2>Scene placement check</h2><p>QA-staged encounter: the regular and a visiting angler beside the player. This fixture is outside the deployed site.</p><button id="oldhat">Old fishing hat</button><button id="canvasbag">Canvas satchel</button><button id="raincoat">Rain jacket</button><br><canvas id="scene"></canvas>
<script type="module">
import {drawShorePerson} from '../../dist/shore-people.js';
import {createPixelSprites} from '../../dist/pixel-sprites.js';
import {createPacificaWorld} from '../../dist/pacifica-world.js';
import {PacificaSimulation} from '../../dist/pacifica-sim.js';
const styles=[['player','Player','Coral jacket, olive vest, green sunhat'],['staff','Tackle shop staff','Gold work shirt, teal apron, navy work cap'],['warden','Fish warden','Green uniform, campaign hat, radio and clipboard'],['oldhat','Old fishing hat','Weathered bucket hat, pocket vest, silver beard'],['canvasbag','Canvas satchel','Rust knit cap, blue jacket, canvas shoulder bag'],['raincoat','Rain jacket','Mustard hooded raincoat, reflective hem, tall boots'],['regular','空军大队长','Blue baseball cap, cream scarf, navy bib waders']];
for(const [id,name,desc]of styles){const a=document.createElement('article');a.innerHTML=`<h2>${name}</h2><canvas width="240" height="138"></canvas><small>${desc}</small>`;gallery.append(a);const c=a.querySelector('canvas').getContext('2d');c.imageSmoothingEnabled=false;c.fillStyle='#bdd0b5';c.fillRect(0,0,240,138);for(const [n,facing]of ['down','up',1].entries()){c.save();c.translate(42+n*76,112);drawShorePerson(c,{style:id,facing,scale:2,walking:n===2,fishing:n===1,time:.12});c.restore();}}
const sp=createPixelSprites();for(const [id,name] of [['angler','Santa Cruz player'],['dockWorker','Santa Cruz counter staff'],['warden','Santa Cruz fish warden']]){const a=document.createElement('article');a.innerHTML=`<h2>${name}</h2><canvas width="240" height="138"></canvas><small>Existing distinct boat-scene sprite retained.</small>`;gallery.append(a);const c=a.querySelector('canvas').getContext('2d');c.imageSmoothingEnabled=false;c.fillStyle='#bdd0b5';c.fillRect(0,0,240,138);c.drawImage(sp[id],88,14,sp[id].width*4,sp[id].height*4);}
const sim=new PacificaSimulation(),s=sim.state,sceneCanvas=document.querySelector('#scene'),world=createPacificaWorld(sceneCanvas),x=1760,y=sim.world.shoreY(x)+80;world.resize(900,600);world.setInsets({top:25,bottom:25});Object.assign(s.player,{x,y,facing:-1});s.elapsed=90;s.regular={...s.regular,mode:'soaking',x:x+75,y:y-10,bait:{x:x+75,y:y-140},route:[]};s.shoreLore.encounter={id:9901,x:x-75,y:y-5,angler:0,expiresAt:999};
function draw(){world.draw(s,s.elapsed);}for(const [i,id]of ['oldhat','canvasbag','raincoat'].entries())document.getElementById(id).onclick=()=>{s.shoreLore.encounter.angler=i;draw();};draw();
</script></html>
