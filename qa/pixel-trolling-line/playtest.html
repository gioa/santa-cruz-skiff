<!doctype html><meta charset="utf-8"><title>拖钓鱼线画面验证 · 本机测试</title>
<style>body{background:#163e47;color:#fff1d5;font:16px sans-serif;margin:20px}main{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}canvas{width:100%;height:520px;image-rendering:pixelated}h2{font-size:16px}p{font-size:13px}section{min-width:0}</style>
<h1>拖钓鱼线画面验证 · 本机测试</h1><p>同一条 15 m 鱼线，真实物理推进；不发布测试文字。</p><main></main>
<script type="module">
import {createPixelWorld} from '../../dist/pixel-world.js';
import {createPixelSprites} from '../../dist/pixel-sprites.js';
if(location.hostname!=='localhost')throw Error('Local QA only');
const snapshots=await fetch('./states.json').then(r=>r.json()),labels=['静止下线','匀速拖钓','转弯后钓组滞后','停船后钓组下沉'],sprites=createPixelSprites();
for(let i=0;i<snapshots.length;i++){
 const section=document.createElement('section');section.innerHTML=`<h2>${labels[i]}</h2><canvas></canvas>`;document.querySelector('main').append(section);
 const s=snapshots[i];s.boatX-=130;s.boatZ-=180;for(const p of[s.bobber,s.rodTip,s.lineEntry]){p.x-=130;p.z-=180;}
 Object.assign(s,{mode:'boat',launchStage:'afloat',loaded:true,engine:i===1||i===2,controlPanel:'helm',rodTipMotion:null,elapsed:0});
 const world=createPixelWorld(section.querySelector('canvas'),{sprites});world.resize(300,520);world.setBottomInset(10);world.setTopInset(10);world.draw(s,0);
}
</script>
