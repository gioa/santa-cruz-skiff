<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鱼种图标核对 · v31</title><style>*{box-sizing:border-box}body{margin:0;padding:20px;background:#173f43;color:#fff0cf;font:15px system-ui}h1{font-size:22px;margin:0 0 8px}p{color:#c8d5bd;margin:0 0 18px}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}article{background:#f4e6c4;color:#173f43;padding:12px;border:2px solid #93b5a7}h2{font-size:16px;margin:4px 0}small{display:block;font-size:11px}canvas{display:block;width:100%;height:auto;image-rendering:pixelated;margin:6px 0}article p{color:#526b64;font-size:12px;margin:8px 0 0}select{padding:10px;font-size:15px}#board{max-width:600px;background:#c2d4b7}section{margin-top:22px}@media(max-width:600px){body{padding:12px}main{grid-template-columns:1fr}article{display:grid;grid-template-columns:1fr 140px}article canvas{grid-row:1/5;grid-column:2}article p{grid-column:1}}</style>
<h1>Santa Cruz · 鱼种图标核对</h1><p>原生像素图放大，核对体色与形态；游戏鱼获仍按实际长度显示。</p><main id="atlas"></main><section><h2>游戏测量板 / 旧存档名称映射</h2><select id="pick" aria-label="测量板鱼种"></select><canvas id="board"></canvas><output id="status"></output></section>
<script type="module">
import {PIXEL_FISH} from '../../dist/pixel-sim.js?v=20260927-pixel-v31';
import {createPixelSprites} from '../../dist/pixel-sprites.js?v=20260927-pixel-v31';
import {fishSpriteKind,drawFishArt} from '../../dist/pixel-fish-art.js?v=20260927-pixel-v31';
const sprites=createPixelSprites(),notes={blue:'蓝灰底色 · 深色斑驳 · 小嘴',copper:'铜褐斑纹 · 后半侧线浅带 · 白腹',vermilion:'朱红体色 · 红色背鳍 · 近平尾',lingcod:'长体大口 · 橄榄褐斑纹 · 圆尾',halibut:'褐色扁平体 · 双眼同侧',sanddab:'浅褐斑点 · 小口 · 圆尾',mackerel:'蓝绿波纹背 · 银腹 · 深叉尾',salmon:'银色海洋型 · 脂鳍 · 尾两叶黑点',seabass:'银灰长体 · 长背鳍 · 大斜嘴',bonito:'蓝背斜纹 · 窄尾柄 · 尾前小鳍',croaker:'银铜体色 · 胸鳍基部暗斑'};
const fish=[...PIXEL_FISH].sort((a,b)=>['blue','copper','vermilion'].indexOf(fishSpriteKind(a))<0?1:['blue','copper','vermilion'].indexOf(fishSpriteKind(b))<0?-1:['blue','copper','vermilion'].indexOf(fishSpriteKind(a))-['blue','copper','vermilion'].indexOf(fishSpriteKind(b)));
for(const f of fish){const kind=fishSpriteKind(f),article=document.createElement('article');article.innerHTML=`<h2>${f.commonName}</h2><small>${f.name}</small><small>${f.latin}</small><p>${notes[kind]}</p>`;const c=document.createElement('canvas');c.width=192;c.height=96;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle='#c2d4b7';ctx.fillRect(0,0,192,96);ctx.drawImage(sprites.fish[kind],0,0,192,96);article.append(c);document.querySelector('#atlas').append(article);const option=document.createElement('option');option.value=f.latin;option.textContent=f.commonName;document.querySelector('#pick').append(option);}
function board(){const f=fish.find(f=>f.latin===document.querySelector('#pick').value),kind=fishSpriteKind({name:f.name}),length=f.referenceLength||((f.min+f.max)/2);drawFishArt(document.querySelector('#board'),sprites.fish[kind],{...f,length},{width:480,height:180});document.querySelector('#status').textContent=`中文旧存档 → ${kind} · ${(length/2.54).toFixed(1)} in`;}
document.querySelector('#pick').onchange=board;board();
</script></html>
