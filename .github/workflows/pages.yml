name: Publish fishing game
on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh public NOAA observations
        run: python3 scripts/refresh-marine.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check JavaScript and simulation invariants
        run: |
          node scripts/check.mjs
          node --test tests/*.test.js
      - name: Bundle and fingerprint the site
        run: node scripts/build.mjs build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
